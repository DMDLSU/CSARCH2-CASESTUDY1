<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binary Arithmetic & Converter</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>CSARCH2</h1>
            <p class="subtitle">Group 1</p>
            <p class="subtitle2">Machine 1</p>
        </header>

        <nav class="tabs">
            <button class="tab-btn active" onclick="switchTab('arithmetic')">Arithmetic</button>
            <button class="tab-btn" onclick="switchTab('converter')">Converter</button>
        </nav>


        <section id="arithmetic" class="tab-content active">
            <div class="input-group">
                <label for="opType">Operation</label>
                <select id="opType">
                    <option value="multiply">Sequential Multiply</option>
                    <option value="divide">Non-Restoring Divide</option>
                </select>
            </div>
            <div class="input-row">
                <div class="input-group">
                    <label for="input1" id="lblInput1">Multiplicand</label>
                    <input type="text" id="input1" placeholder="e.g. 1100 or 12">
                </div>
                <div class="input-group">
                    <label for="input2" id="lblInput2">Multiplier</label>
                    <input type="text" id="input2" placeholder="e.g. 1101 or 13">
                </div>
                <div class="input-group">
                    <label for="arithBits">Bits</label>
                    <input type="number" id="arithBits" value="4" min="2" max="32">
                </div>
            </div>
            <button class="primary-btn" onclick="runArithmetic()">Calculate</button>
        </section>


        <section id="converter" class="tab-content">
            <div class="input-group">
                <label for="convType">Conversion Type</label>
                <select id="convType">
                    <option value="unsigned">Unsigned</option>
                    <option value="signed">Signed</option>
                </select>
            </div>
            <div class="input-row">
                <div class="input-group">
                    <label for="convInput">Number (Decimal)</label>
                    <input type="number" id="convInput" placeholder="e.g. 10">
                </div>
                <div class="input-group">
                    <label for="convBits">Bits</label>
                    <input type="number" id="convBits" value="8" min="2" max="32">
                </div>
            </div>
            <button class="primary-btn" onclick="runConverter()">Convert</button>
        </section>


        <div class="results-container">
            <h3>Output</h3>
            <div id="output" class="output-box">Output</div>
        </div>
    </div>

    <!-- Import -->
    <script src="arithmetic.js"></script>
    <script src="converter.js"></script>
    <script src="app.js"></script>
</body>

</html>
